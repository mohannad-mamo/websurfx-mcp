[package]
name = "websurfx-mcp"
version = "0.3.1"
edition = "2021"
rust-version = "1.85"
authors = ["Mohannad (mohannad-mamo)"]
description = "A Model Context Protocol server for the Websurfx search API"
license = "MIT"
repository = "https://github.com/mohannad-mamo/websurfx-mcp"
readme = "README.md"
keywords = ["mcp", "websurfx", "search", "model-context-protocol"]
categories = ["web-programming", "command-line-utilities"]

[dependencies]
rmcp = { version = "0.8.5", features = ["server", "macros", "transport-io", "transport-streamable-http-server"] }
axum = "0.8"
schemars = "1.0"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls-native-roots"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.0", features = ["full"] }
anyhow = "1.0"
thiserror = "2.0"
url = "2.5"
subtle = "2.6"
