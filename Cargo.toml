[package]
name = "searxng-mcp"
version = "0.1.0"
edition = "2021"
description = "A Model Context Protocol server for SearXNG search API"
license = "MIT"
repository = "https://github.com/nicholasq/searxng-mcp"

[dependencies]
rmcp = { version = "0.8.5", features = ["server", "macros", "transport-io"] }
schemars = "1.0"
reqwest = { version = "0.12", features = ["json"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.0", features = ["full"] }
anyhow = "1.0"
thiserror = "2.0"
url = "2.5"

[dev-dependencies]
tokio-test = "0.4"
