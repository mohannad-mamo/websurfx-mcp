name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

env:
  CARGO_TERM_COLOR: always
  WEBSURFX_VERSION: "1.31.1"

jobs:
  test:
    name: Test
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Test
        run: cargo test

  docker:
    name: Standalone Docker (multi-arch)
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    needs: test
    steps:
      - uses: actions/checkout@v7

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=sha,prefix=sha-,format=short
            type=raw,value=edge,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: true

  all-in-one-meta:
    name: All-in-one metadata
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    needs: test
    if: github.event_name != 'pull_request'
    outputs:
      tags: ${{ steps.meta.outputs.tags }}
      labels: ${{ steps.meta.outputs.labels }}
    steps:
      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/websurfx-all-in-one
          tags: |
            type=sha,prefix=sha-,format=short
            type=raw,value=edge,enable={{is_default_branch}}
            type=semver,pattern={{version}}-ws${{ env.WEBSURFX_VERSION }}
            type=semver,pattern={{major}}.{{minor}}-ws${{ env.WEBSURFX_VERSION }}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
          labels: |
            org.opencontainers.image.title=websurfx-all-in-one
            org.opencontainers.image.description=Websurfx ${{ env.WEBSURFX_VERSION }} plus websurfx-mcp
            org.opencontainers.image.licenses=MIT AND AGPL-3.0

  all-in-one-build:
    name: All-in-one ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    needs: all-in-one-meta
    if: github.event_name != 'pull_request'
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-26.04
            arch: amd64
          - platform: linux/arm64
            runner: ubuntu-26.04-arm
            arch: arm64
    steps:
      - uses: actions/checkout@v7

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/all-in-one/Dockerfile
          platforms: ${{ matrix.platform }}
          labels: ${{ needs.all-in-one-meta.outputs.labels }}
          build-args: |
            WEBSURFX_TAG=v${{ env.WEBSURFX_VERSION }}
          outputs: type=image,name=ghcr.io/${{ github.repository_owner }}/websurfx-all-in-one,push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=all-in-one-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=all-in-one-${{ matrix.arch }}

      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@v7
        with:
          name: digests-${{ matrix.arch }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  all-in-one-merge:
    name: All-in-one manifest
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    needs: [all-in-one-meta, all-in-one-build]
    if: github.event_name != 'pull_request'
    steps:
      - name: Download digests
        uses: actions/download-artifact@v8
        with:
          path: /tmp/digests
          pattern: digests-*
          merge-multiple: true

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create multi-arch manifest
        working-directory: /tmp/digests
        env:
          TAGS: ${{ needs.all-in-one-meta.outputs.tags }}
        run: |
          set -euo pipefail
          args=()
          while IFS= read -r tag; do
            if [ -n "$tag" ]; then
              args+=("-t" "$tag")
            fi
          done <<< "$TAGS"
          refs=()
          for digest in *; do
            refs+=("ghcr.io/${{ github.repository_owner }}/websurfx-all-in-one@sha256:${digest}")
          done
          docker buildx imagetools create "${args[@]}" "${refs[@]}"
          docker buildx imagetools inspect "${args[1]}"

  all-in-one-smoke:
    name: All-in-one smoke
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    needs: all-in-one-merge
    if: github.event_name != 'pull_request'
    steps:
      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull image
        run: |
          docker pull "ghcr.io/${{ github.repository_owner }}/websurfx-all-in-one:sha-${GITHUB_SHA::7}"

      - name: Start container
        run: |
          docker run -d --rm --name ws-all-in-one-smoke \
            -p 18080:8080 -p 18001:8001 \
            -e MCP_AUTH_TOKEN=smoke-test-token \
            "ghcr.io/${{ github.repository_owner }}/websurfx-all-in-one:sha-${GITHUB_SHA::7}"

      - name: Wait for both services
        run: |
          for _ in $(seq 1 120); do
            if curl -fsS http://127.0.0.1:18001/healthz >/dev/null \
              && curl -fsS http://127.0.0.1:18080/ >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          docker logs ws-all-in-one-smoke
          exit 1

      - name: Check bearer auth
        run: |
          no_token=$(curl -s -o /dev/null -w '%{http_code}' -X POST http://127.0.0.1:18001/mcp \
            -H 'Content-Type: application/json' \
            -H 'Accept: application/json, text/event-stream' \
            --data '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-03-26","capabilities":{},"clientInfo":{"name":"ci","version":"0"}}}')
          with_token=$(curl -s -o /dev/null -w '%{http_code}' -X POST http://127.0.0.1:18001/mcp \
            -H 'Content-Type: application/json' \
            -H 'Accept: application/json, text/event-stream' \
            -H 'Authorization: Bearer smoke-test-token' \
            --data '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-03-26","capabilities":{},"clientInfo":{"name":"ci","version":"0"}}}')
          test "$no_token" = "401"
          test "$with_token" = "200"

      - name: Cleanup
        if: always()
        run: docker stop ws-all-in-one-smoke || true
